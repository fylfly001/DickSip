   DickSip 静态快照 · 优化层
   追加在原始 app CSS 之后，只覆盖可见组件用到的变量
   ========================================================================== */

/* ---------- 1. 字体：删掉 KaTeX/Roboto Mono 的 410KB base64，改用系统栈 ---------- */
:root {
  --dks-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC",
    Roboto, "Helvetica Neue", Arial, sans-serif;
  --dks-font-code: "Cascadia Mono", ui-monospace, SFMono-Regular, Consolas,
    "JetBrains Mono", Menlo, monospace;
  --dks-ease: cubic-bezier(.32, .72, .24, 1);
}

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--dsr-bg, #fff);
  color: var(--dks-text, #0d0d0d);
  font-family: var(--dks-font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  min-height: 100dvh;
}

::selection { background: rgba(77, 107, 254, .18); }

/* ---------- 2. 布局：把写死的 7.5vh 位移收敛成有上下限的值 ---------- */
.a85a674a,
.eb830e32 { transform: translateY(clamp(28px, 7.5vh, 104px)); }

.a2f8e4bb { padding-bottom: 56px; }

/* 顶栏（原站为空占位）：补一条发丝分隔线，避免留白突兀 */
.be88ba8a {
  background-color: var(--dks-topbar-bg, transparent);
  border-bottom: 1px solid var(--dks-hairline, transparent);
}

/* 消息区顶部渐隐遮罩（原为硬编码白色渐变） */
.b480065b {
  background: linear-gradient(var(--dks-fade-top, rgba(255, 255, 255, .8)), transparent);
}

/* ---------- 3. 侧边栏 ---------- */
.f0d4f23d {
  background-color: var(--dks-side-bg, var(--dsr-side-bg));
  border-right: 1px solid var(--dks-hairline, transparent);
  padding-top: 16px !important;
}

.a7f3a288 > .ds-icon:first-child {
  transition: transform .35s var(--dks-ease);
  flex: 0 0 auto;
}
.a7f3a288 > .ds-icon:first-child:hover { transform: translateY(-1px) scale(1.05); }
/* 鲸鱼标志是宽幅图形，让它填满 44px 位的宽度 */
.a7f3a288 > .ds-icon:first-child > svg {
  width: 44px !important;
  height: 44px !important;
  display: block;
}

.ds-icon-button,
.b91228e4 { border-radius: 10px; }

/* 侧栏底部：主题切换按钮（与原有图标按钮同规格） */
.dks-theme-btn {
  margin-bottom: 14px;
  color: var(--dsr-text-3);
}

/* ---------- 4. 欢迎区文案 ---------- */
.a85a674a {
  color: var(--dks-welcome, #000);
  text-align: center;
}

.c7e7df4d {
  font-size: clamp(24px, 2.6vw, 30px);
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.35;
  margin-top: auto;
  margin-bottom: 2px;
  background: linear-gradient(104deg, var(--dks-title-a, #14161a) 12%, var(--dks-title-b, #4d6bfe) 78%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.a8d0e1d3 {
  color: var(--dks-text-2, #6b6f76);
  font-size: 15px;
  line-height: 1.75;
  margin: 10px 0 26px !important;
  max-width: 34em;
}

/* 欢迎区大鲸鱼：标题上方 */
.dks-bigmark {
  display: flex;
  justify-content: center;
  margin: auto 0 20px;
}
.dks-bigmark svg {
  width: 84px;
  height: 45px;
  display: block;
}
/* 标题原本靠 margin-top:auto 顶到底部，有大鲸鱼时让鲸鱼吃掉这段留白 */
.a85a674a > .dks-bigmark + .c7e7df4d { margin-top: 0; }

/* 状态提示（原文件里被硬塞进 placeholder 的那句吐槽） */
.dks-status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 22px;
  padding: 5px 12px 5px 10px;
  border-radius: 999px;
  font-size: 12.5px;
  line-height: 18px;
  color: var(--dks-warn-fg, #a05a1f);
  background: var(--dks-warn-bg, rgba(228, 119, 61, .09));
  border: 1px solid var(--dks-warn-line, rgba(228, 119, 61, .22));
}
.dks-status::before {
  content: "";
  width: 7px; height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: currentColor;
  animation: dksPulse 1.8s var(--dks-ease) infinite;
}
@keyframes dksPulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* ---------- 5. 输入卡片 ---------- */
.cefa5c26 .dd442025 {
  border-radius: 26px;
  background-color: var(--dks-input-bg, var(--dsr-input-bg));
  box-shadow: 0 0 0 .5px var(--dks-input-line, var(--dsr-input-border)),
              0 1px 2px rgba(15, 20, 40, .04);
  transition: box-shadow .22s var(--dks-ease), background-color .22s var(--dks-ease),
              transform .22s var(--dks-ease);
}

.cefa5c26 .dd442025:focus-within {
  background-color: var(--dks-input-focus-bg, #fff);
  box-shadow: 0 0 0 .5px var(--dks-focus-ring, rgba(77, 107, 254, .55)),
              0 6px 24px -8px rgba(77, 107, 254, .28);
  transform: translateY(-1px);
}

/* placeholder：原来用一长串空格硬换行，窄屏会溢出；改成两行居中排布 */
.cefa5c26 .c92459f0::placeholder {
  color: var(--dks-placeholder, rgba(13, 13, 13, .38));
  line-height: 1.6;
}

.cefa5c26 .fad49dec { max-height: calc(10 * var(--ds-line-height-l)); }

/* ---------- 6. 模式胶囊 ---------- */
.d9f56c96 {
  --ds-button-color: var(--dks-chip-bg, #fff) !important;
  --button-text-color: var(--dks-chip-fg, #4c4c4c) !important;
  --ds-button-hover-color: var(--dks-chip-hover, #eef1f8) !important;
  --button-border-color: var(--dks-chip-line, rgba(0, 0, 0, .12)) !important;
  height: 30px;
  border-radius: 15px;
  transition: background-color .18s var(--dks-ease), border-color .18s var(--dks-ease),
              color .18s var(--dks-ease), transform .18s var(--dks-ease);
}

.d9f56c96:hover { transform: translateY(-1px); }
.d9f56c96:active { transform: translateY(0); }

.d9f56c96.dks-on {
  --ds-button-color: var(--dks-chip-on-bg, rgba(77, 107, 254, .1)) !important;
  --button-text-color: var(--dks-chip-on-fg, #3b5bfd) !important;
  --ds-button-hover-color: var(--dks-chip-on-bg, rgba(77, 107, 254, .16)) !important;
  --button-border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .38)) !important;
}

.d9f56c96 .ad0c98fd { font-size: 12.5px; font-weight: 500; }

/* 原 CSS 中硬编码的悬停色（#e0e4ed）改为可换肤 */
.f02f0e25:hover { background-color: var(--dks-hover-solid, #e0e4ed); }

/* 键盘提示（原被硬塞进 placeholder） */
.dks-hint {
  font-size: 11.5px;
  line-height: 16px;
  color: var(--dks-text-3, #a3a3a3);
  padding-left: 4px;
  user-select: none;
  white-space: nowrap;
}
@media (max-width: 720px) { .dks-hint { display: none; } }

/* ---------- 7. 发送按钮 ---------- */
.f6d670 {
  background: linear-gradient(160deg, #5b7cff, #4d6bfe 60%, #3f5ae8);
  box-shadow: 0 4px 14px -4px rgba(77, 107, 254, .55);
  transition: filter .18s var(--dks-ease), transform .18s var(--dks-ease),
              box-shadow .18s var(--dks-ease), opacity .18s var(--dks-ease);
}

.f6d670:hover { background-color: #2563eb; filter: brightness(1.06); transform: translateY(-1px); }
.f6d670:active { transform: translateY(0) scale(.96); }

/* 原快照把按钮钉死成 disabled；这里只在真空闲时保持禁用观感 */
.f6d670.bcc55ca1 {
  background: var(--dks-send-off-bg, #d6dbe6);
  color: var(--dks-send-off-fg, #fff);
  box-shadow: none;
  cursor: not-allowed;
}

/* ---------- 8. 页脚免责声明 ---------- */.d9fb9344 {
  position: static;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  font-size: 12px;
  color: var(--dks-text-3, #a3a3a3);
  letter-spacing: .02em;
}
.d9fb9344::before { content: "— "; opacity: .45; }
.d9fb9344::after  { content: " —"; opacity: .45; }

/* 页脚里的合规声明：静态写在 HTML 里，不依赖 JS。
   公开托管时这行是唯一的肉眼可见免责，所以比周围的页脚小字更重一格。 */
.dks-official-note {
  color: var(--dks-text, #4a4e54);
  font-size: 12.5px;
  font-weight: 500;
}
.dks-official-note::after { content: "·"; margin: 0 7px; opacity: .55; }

/* ---------- 9. 对话区（交互版新增） ---------- */
.dks-msgs {
  flex-direction: column;
  gap: 18px;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  max-width: 100%;
  padding: 8px 4px 20px;
  display: flex;
  order: -1;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

.dks-row { display: flex; gap: 12px; align-items: flex-start; animation: dksIn .34s var(--dks-ease) both; }
.dks-row.dks-me { justify-content: flex-end; }

.dks-ava {
  width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px;
  background: var(--dks-ava-bg, #eef2ff);
  border: 1px solid var(--dks-bubble-line, transparent);
  color: #fff; font-size: 13px; font-weight: 700; line-height: 28px;
  text-align: center; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.dks-ava > svg {
  width: 22px !important;
  height: 22px !important;
  display: block;
}

/* 气泡 + 其下方操作行的竖排容器 */
.dks-col {
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
  min-width: 0;
  max-width: min(560px, calc(100% - 44px));
  display: flex;
}

.dks-actions {
  align-items: center;
  gap: 8px;
  padding-left: 2px;
  display: flex;
  flex-wrap: wrap;
}
.dks-actions:empty { display: none; }

.dks-meta {
  font-size: 11.5px;
  line-height: 16px;
  color: var(--dks-text-3, #a3a3a3);
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
}

/* 气泡下方的小按钮 */
.dks-btn {
  font: inherit;
  font-size: 12px;
  line-height: 18px;
  padding: 3px 11px;
  border-radius: 999px;
  cursor: pointer;
  border: 1px solid var(--dks-chip-line, rgba(0, 0, 0, .12));
  background: var(--dks-chip-bg, #fff);
  color: var(--dks-chip-fg, #4c4c4c);
  transition: background-color .16s var(--dks-ease), border-color .16s var(--dks-ease),
              color .16s var(--dks-ease), transform .16s var(--dks-ease);
}
.dks-btn:hover {
  background: var(--dks-chip-hover, #eef1f8);
  transform: translateY(-1px);
}
.dks-btn:active { transform: translateY(0) scale(.97); }
.dks-btn:disabled { opacity: .5; cursor: default; transform: none; }
.dks-btn:focus-visible {
  outline: 2px solid var(--dks-focus-ring, rgba(77, 107, 254, .7));
  outline-offset: 2px;
}

.dks-btn--primary {
  background: var(--dks-chip-on-bg, rgba(77, 107, 254, .1));
  border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .38));
  color: var(--dks-chip-on-fg, #3b5bfd);
  font-weight: 500;
}
.dks-btn--primary:hover {
  background: var(--dks-chip-on-hover, rgba(77, 107, 254, .18));
}

.dks-btn--ghost {
  background: transparent;
  border-color: transparent;
  color: var(--dks-text-3, #a3a3a3);
}
.dks-btn--ghost:hover {
  background: var(--dks-chip-hover, #eef1f8);
  color: var(--dks-chip-fg, #4c4c4c);
}

.dks-bubble {
  max-width: 100%;
  padding: 11px 15px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.7;
  word-break: break-word;
  white-space: pre-wrap;
  border: 1px solid var(--dks-bubble-line, transparent);
  min-width: 0;
}
/* 用户气泡是行的直接子项，行的宽度是确定的，百分比 max-width 才可靠 */
.dks-me .dks-bubble { max-width: min(560px, 78%); }
.dks-bot .dks-bubble {
  background: var(--dks-bubble-bot, #f5f6fa);
  color: var(--dks-text, #0d0d0d);
  border-top-left-radius: 6px;
}
.dks-me .dks-bubble {
  background: var(--dks-bubble-me, #4d6bfe);
  color: #fff;
  border-top-right-radius: 6px;
}

.dks-bubble.dks-typing::after {
  content: "";
  display: inline-block;
  width: 14px; height: 14px;
  margin-left: 6px;
  vertical-align: -2px;
  border-radius: 50%;
  border: 2px solid var(--dks-text-3, #a3a3a3);
  border-top-color: transparent;
  animation: dksSpin .7s linear infinite;
}

@keyframes dksIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes dksSpin { to { transform: rotate(1turn); } }

/* 进入对话态：欢迎语让位给消息流，输入框贴底 */
.dks-chat .a85a674a { display: none; }
.dks-chat .eb830e32 { transform: none; }
.dks-chat .a2f8e4bb { justify-content: flex-start; }
.dks-chat .aaff8b8f { flex-grow: 0; padding-top: 0; }
.dks-chat .a2f8e4bb { padding-bottom: 8px; }
/* ---------- 10. 滚动条 ---------- */
* { scrollbar-width: thin; scrollbar-color: var(--dks-scroll, rgba(0, 0, 0, .18)) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--dks-scroll, rgba(0, 0, 0, .18));
  border: 3px solid transparent;
  border-radius: 999px;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--dks-scroll-h, rgba(0, 0, 0, .32)); background-clip: content-box; }

/* ---------- 11. 焦点可见性（键盘可达性） ---------- */
[role="button"]:focus-visible,
textarea:focus-visible,
.ds-icon-button:focus-visible,
.dks-theme-btn:focus-visible {
  outline: 2px solid var(--dks-focus-ring, rgba(77, 107, 254, .7));
  outline-offset: 2px;
}

/* ---------- 12. 深色模式：单一来源
   令牌只写一份（dark_tokens.css），构建时注入到唯一的 html[data-dks-theme="dark"] body{…}；
   「跟随系统」由 JS 解析成 dark/light 后写到同一个属性上，CSS 不再复制第二套令牌。
   占位符只允许出现一次，且绝不能写进注释里（注释里的占位符会把注释提前闭合）。
   原 CSS 把 dsr 与 ds-rgb 系列变量定义在 body 上，因此这里同层覆盖。 */
html[data-dks-theme="dark"] body{/* 文本与背景 */
  --dks-text: #e8eaef;
  --dks-welcome: #e8eaef;
  --dks-text-2: #a8adb8;
  --dks-text-3: #7c828e;
  --dks-title-a: #f2f4f8;
  --dks-title-b: #8aa2ff;
  --dks-hairline: rgba(255, 255, 255, .07);
  --dks-topbar-bg: #101114;
  --dks-fade-top: rgba(16, 17, 20, .8);
  --dks-side-bg: #16171b;
  --dsr-bg: #101114;
  --dsr-side-bg: #16171b;
  --dks-input-bg: #1c1e23;
  --dks-input-focus-bg: #21242a;
  --dks-input-line: rgba(255, 255, 255, .12);
  --dks-placeholder: rgba(232, 234, 239, .38);
  --dks-focus-ring: rgba(122, 148, 255, .6);
  --dks-hover-solid: #2b2f38;
  /* 胶囊与按钮 */
  --dks-chip-bg: #23262d;
  --dks-chip-fg: #cfd3dc;
  --dks-chip-hover: #2b2f38;
  --dks-chip-line: rgba(255, 255, 255, .12);
  --dks-chip-on-bg: rgba(122, 148, 255, .16);
  --dks-chip-on-fg: #a8bcff;
  --dks-chip-on-line: rgba(122, 148, 255, .42);
  --dks-send-off-bg: #2b2f38;
  --dks-send-off-fg: #6c7280;
  /* 状态提示 */
  --dks-warn-fg: #e0a166;
  --dks-warn-bg: rgba(228, 119, 61, .12);
  --dks-warn-line: rgba(228, 119, 61, .3);
  --dks-ava-bg: #23262d;
  --dks-res-bg: rgba(255, 255, 255, .04);
  /* 气泡 */
  --dks-bubble-bot: #1e2128;
  --dks-bubble-me: #3d5ae0;
  --dks-bubble-line: rgba(255, 255, 255, .06);
  --dks-track: rgba(255, 255, 255, .14);
  /* 滚动条 */
  --dks-scroll: rgba(255, 255, 255, .16);
  --dks-scroll-h: rgba(255, 255, 255, .3);
  /* 覆盖原 CSS 里硬编码在 body 上的调色板令牌 */
  --ds-rgb-label-1: 232 234 239;
  --ds-rgb-label-2: 168 173 184;
  --ds-rgb-label-3: 124 130 142;
  --ds-rgb-hover: 38 42 50;
  --ds-rgb-bg-base: 16 17 20;
  --ds-rgb-elevated: 22 23 27;
  --ds-rgb-gray-100: 28 30 35;
  --ds-rgb-input: 28 30 35;
  --ds-rgb-input-strong: 43 47 56;
  --ds-rgb-neutral-100: 38 42 50;
  --ds-rgb-neutral-150: 43 47 56;
  --ds-rgb-slate-250: 43 47 56;
  --dsr-input-bg: #1c1e23;
  --dsr-input-border: rgba(255, 255, 255, .12);
  --dsr-text-0: #f2f4f8;
  --dsr-text-1: #e8eaef;
  --dsr-text-2: #a8adb8;
  --dsr-text-3: #7c828e;
  --dsr-icon-fg-1: #cfd3dc;
  --dsr-side-hover-bg: #23262d;
  --dsr-side-icon-hover: #2b2f38;
  --dsr-icon-hover-0: #2b2f38;
  --dsr-icon-hover-1: #23262d;
  --dsr-border-1: rgba(255, 255, 255, .14);
  --dsr-border-2: rgba(255, 255, 255, .08);
  /* 忠实覆盖层新增令牌（27 段） */
  --dks-cot-bg: #191b20;
  --dks-cot-line: rgba(255, 255, 255, .08);
  --dks-icon-hover: rgba(255, 255, 255, .07);
  /* markdown（28 段） */
  --dks-ic-bg: rgba(232, 234, 239, .1);
  --dks-ic-fg: #dfe3ea;
  --dks-code-bg: #15171c;
  --dks-code-head: #1d2026;
  --dks-code-fg: #d5d9e2;
  --dks-tk-c: #6b7280;
  --dks-tk-s: #7dd3a0;
  --dks-tk-k: #8aa2ff;
  --dks-tk-n: #e0a166;
  /* 收起态 dock（30 段） */
  --dks-mini-bg: #1e2126;
  --dks-mini-line: rgba(255, 255, 255, .12);
  /* 删除失败提示（37 段） */
  --dks-delerr-bg: rgba(229, 72, 77, .13);
  --dks-delerr-line: rgba(229, 72, 77, .34);
  --dks-delerr-fg: #f0a6a1;}

html[data-dks-theme="dark"] { color-scheme: dark; }

/* ---------- 13. 窄屏 ---------- */
@media (max-width: 767px) {
  /* 侧栏在窄屏被推到屏幕外（原站靠汉堡按钮拉回，本快照无侧栏内容），
     把主题开关摘出来钉在左上角，保证仍然可达 */
  .dks-theme-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 20;
    margin: 0;
    padding: 4px;
    border-radius: 10px;
    background-color: var(--dks-chip-bg, #fff);
    box-shadow: 0 0 0 .5px var(--dks-chip-line, rgba(0, 0, 0, .12));
  }
}

@media (max-width: 640px) {
  .a85a674a, .eb830e32 { transform: translateY(clamp(12px, 5vh, 56px)); }
  .a2f8e4bb { padding: 0 18px 40px; }
  .c7e7df4d { font-size: 22px; }
  .a8d0e1d3 { font-size: 14px; }
  .dc04ec1d.a02af2e6 { max-width: 56px; }
  .a7f3a288 { width: 56px; }
  .dks-bubble { max-width: 84%; font-size: 14.5px; }
}

/* ---------- 14. 动效降级 & 打印 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

@media print {
  body { background: #fff; }
  .f0d4f23d, .bf38813a, .ec4f5d61 { display: none !important; }
  .a2f8e4bb { max-width: none; padding: 0; }
  .a85a674a, .eb830e32 { transform: none; }
}

/* ================= 15. 侧栏历史面板 ================= */
.dks-backdrop {
  position: fixed;
  inset: 0;
  z-index: 35;
  background: rgba(8, 10, 16, .34);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s var(--dks-ease);
}
.dks-backdrop.is-open { opacity: 1; pointer-events: auto; }
@media (min-width: 768px) { .dks-backdrop { background: transparent; } }

.dks-side {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 40;
  width: 260px;
  display: flex;
  flex-direction: column;
  background: var(--dks-side-bg, var(--dsr-side-bg));
  border-right: 1px solid var(--dks-hairline, rgba(0, 0, 0, .07));
  box-shadow: 12px 0 40px -18px rgba(8, 12, 30, .35);
  transform: translateX(-104%);
  transition: transform .28s var(--dks-ease);
  padding: 14px 12px calc(12px + env(safe-area-inset-bottom));
  color: var(--dks-text, #0d0d0d);
}
.dks-side.is-open { transform: none; }

.dks-side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 4px 12px;
}
.dks-side-brand {
  font-size: 15px;
  font-weight: 650;
  letter-spacing: .01em;
}
.dks-side-x {
  font: inherit;
  font-size: 13px;
  line-height: 1;
  width: 26px;
  height: 26px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  background: transparent;
  color: var(--dks-text-3, #a3a3a3);
}
.dks-side-x:hover { background: var(--dks-hover-solid, #eef1f8); color: var(--dks-text, #0d0d0d); }

.dks-new {
  font: inherit;
  font-size: 13.5px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  margin-bottom: 14px;
  border-radius: 11px;
  border: 1px dashed var(--dks-chip-line, rgba(0, 0, 0, .14));
  background: transparent;
  color: var(--dks-chip-fg, #4c4c4c);
  cursor: pointer;
  transition: background-color .16s var(--dks-ease), border-color .16s var(--dks-ease), color .16s var(--dks-ease);
}
.dks-new:hover {
  background: var(--dks-chip-on-bg, rgba(77, 107, 254, .08));
  border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .4));
  color: var(--dks-chip-on-fg, #3b5bfd);
}
.dks-new span { flex: 1; text-align: left; }
.dks-new kbd {
  font: inherit;
  font-size: 10.5px;
  padding: 1px 5px;
  border-radius: 5px;
  border: 1px solid var(--dks-chip-line, rgba(0, 0, 0, .12));
  color: var(--dks-text-3, #a3a3a3);
  background: var(--dks-chip-bg, #fff);
}

.dks-side-sub {
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: none;
  color: var(--dks-text-3, #a3a3a3);
  padding: 0 6px 6px;
}

.dks-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.dks-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 8px 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color .15s var(--dks-ease);
}
.dks-item:hover { background: var(--dks-hover-solid, #eef1f8); }
.dks-item.is-active { background: var(--dks-chip-on-bg, rgba(77, 107, 254, .1)); }
.dks-item.is-active::before {
  content: "";
  position: absolute;
  left: 5px; top: 50%;
  width: 3px; height: 18px;
  margin-top: -9px;
  border-radius: 2px;
  background: var(--dks-chip-on-fg, #3b5bfd);
}
.dks-item-main { min-width: 0; flex: 1; }
.dks-item-title {
  font-size: 13px;
  line-height: 18px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--dks-text, #0d0d0d);
}
.dks-item-time {
  font-size: 11px;
  line-height: 15px;
  color: var(--dks-text-3, #a3a3a3);
  font-variant-numeric: tabular-nums;
}
.dks-item-del {
  font: inherit;
  font-size: 11px;
  line-height: 1;
  width: 22px; height: 22px;
  padding: 0;
  flex: 0 0 22px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--dks-text-3, #a3a3a3);
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s var(--dks-ease), background-color .15s var(--dks-ease), color .15s var(--dks-ease);
}
.dks-item:hover .dks-item-del, .dks-item-del:focus-visible { opacity: 1; }
.dks-item-del:hover { background: rgba(220, 60, 60, .12); color: #d64545; }

.dks-empty {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--dks-text-3, #a3a3a3);
  padding: 10px 6px;
}

.dks-side-foot {
  padding: 10px 6px 2px;
  font-size: 11px;
  letter-spacing: .02em;
  color: var(--dks-text-3, #a3a3a3);
  border-top: 1px solid var(--dks-hairline, rgba(0, 0, 0, .06));
  margin-top: 8px;
}

/* ================= 16. 复制按钮 / 用户头像 ================= */
.dks-copy {
  font: inherit;
  font-size: 12px;
  line-height: 1;
  width: 22px; height: 22px;
  flex: 0 0 22px;
  margin-top: 10px;
  padding: 0;
  border: 1px solid var(--dks-chip-line, rgba(0, 0, 0, .1));
  border-radius: 7px;
  background: var(--dks-chip-bg, #fff);
  color: var(--dks-text-3, #a3a3a3);
  cursor: pointer;
  opacity: 0;
  transition: opacity .16s var(--dks-ease), color .16s var(--dks-ease), border-color .16s var(--dks-ease);
}
.dks-row:hover .dks-copy,
.dks-copy:focus-visible { opacity: 1; }
.dks-copy:hover { color: var(--dks-chip-on-fg, #3b5bfd); border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .4)); }
.dks-copy.is-done { color: #16a34a; border-color: rgba(22, 163, 74, .45); opacity: 1; }

.dks-me-ava {
  width: 30px !important;
  height: 30px !important;
  border-radius: 50%;
  background: var(--dks-chip-bg, #eef1f8);
  border: 1px solid var(--dks-hairline, rgba(0, 0, 0, .08));
  color: var(--dks-text-2, #6b6f76);
  font-size: 12px;
  font-weight: 600;
  display: flex !important;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin-bottom: 12px;
  user-select: none;
}
.dks-me-ava:hover { border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .4)); }

/* ================= 17. 关于弹层 ================= */
.dks-modal {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(8, 10, 16, .42);
  opacity: 0;
  transition: opacity .2s var(--dks-ease);
}
.dks-modal.is-open { opacity: 1; }
.dks-modal-card {
  width: min(380px, 100%);
  background: var(--dsr-bg, #fff);
  color: var(--dks-text, #0d0d0d);
  border: 1px solid var(--dks-hairline, rgba(0, 0, 0, .08));
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 24px 60px -20px rgba(8, 12, 30, .45);
  transform: translateY(8px) scale(.98);
  transition: transform .22s var(--dks-ease);
}
.dks-modal.is-open .dks-modal-card { transform: none; }
.dks-modal-mark { width: 44px; height: 44px; margin-bottom: 14px; }
.dks-modal-mark svg { width: 44px; height: 44px; display: block; }
.dks-modal-card h2 {
  font-size: 17px;
  font-weight: 650;
  margin: 0 0 10px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.dks-modal-card h2 span { font-size: 11px; font-weight: 500; color: var(--dks-text-3, #a3a3a3); }
/* 合规声明：关于弹层顶部一枚小胶囊 */
.dks-modal-card .dks-disclaimer {
  display: inline-flex;
  align-items: center;
  margin: 0 0 12px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 18px;
  color: var(--dks-warn-fg, #a05a1f);
  background: var(--dks-warn-bg, rgba(228, 119, 61, .09));
  border: 1px solid var(--dks-warn-line, rgba(228, 119, 61, .22));
}
.dks-modal-card p { font-size: 13.5px; line-height: 1.75; margin: 0 0 12px; color: var(--dks-text-2, #6b6f76); }
.dks-modal-card ul { margin: 0 0 18px; padding-left: 18px; font-size: 12.5px; line-height: 1.9; color: var(--dks-text-2, #6b6f76); }
.dks-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
/* ================= 18. 联网搜索进度 ================= */
.dks-bubble.dks-searching { min-width: 196px; }
.dks-stage { display: inline-block; white-space: nowrap; }
.dks-bubble.dks-searching::after { content: none; }

.dks-bar {
  display: block;
  height: 3px;
  margin-top: 10px;
  border-radius: 999px;
  background: var(--dks-track, rgba(13, 13, 20, .08));
  overflow: hidden;
}
.dks-bar > i {
  display: block;
  height: 100%;
  width: 4%;
  border-radius: inherit;
  background: linear-gradient(90deg, #6b87ff, #4d6bfe);
  transition: width .35s var(--dks-ease);
}

/* ================= 19. 侧栏开关 ================= */
.dks-switch {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  padding: 9px 8px;
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
  transition: background-color .15s var(--dks-ease);
}
.dks-switch:hover { background: var(--dks-hover-solid, #eef1f8); }
.dks-switch-input {
  position: absolute;
  width: 1px; height: 1px;
  opacity: 0;
  pointer-events: none;
}
.dks-switch-track {
  position: relative;
  flex: 0 0 34px;
  width: 34px;
  height: 20px;
  border-radius: 999px;
  background: var(--dks-chip-line, rgba(0, 0, 0, .18));
  transition: background-color .18s var(--dks-ease);
}
.dks-switch-track > span {
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .28);
  transition: transform .18s var(--dks-ease);
}
.dks-switch-input:checked + .dks-switch-track { background: #4d6bfe; }
.dks-switch-input:checked + .dks-switch-track > span { transform: translateX(14px); }
.dks-switch-input:focus-visible + .dks-switch-track {
  outline: 2px solid var(--dks-focus-ring, rgba(77, 107, 254, .7));
  outline-offset: 2px;
}
.dks-switch-text {
  display: flex;
  flex-direction: column;
  font-size: 12.5px;
  line-height: 17px;
  color: var(--dks-text, #0d0d0d);
}
.dks-switch-text small {
  font-size: 10.5px;
  line-height: 14px;
  color: var(--dks-text-3, #a3a3a3);
}
/* ================= 20. 搜索结果卡片 ================= */
.dks-res {
  margin-top: 2px;
  font-size: 12.5px;
  width: 100%;
  max-width: 100%;
}
.dks-res > summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--dks-chip-line, rgba(0, 0, 0, .1));
  color: var(--dks-text-3, #a3a3a3);
  background: transparent;
  user-select: none;
  transition: color .15s var(--dks-ease), border-color .15s var(--dks-ease), background-color .15s var(--dks-ease);
}
.dks-res > summary::-webkit-details-marker { display: none; }
.dks-res > summary::before {
  content: "▸";
  font-size: 10px;
  line-height: 1;
  transition: transform .18s var(--dks-ease);
}
.dks-res[open] > summary::before { transform: rotate(90deg); }
.dks-res > summary:hover {
  color: var(--dks-chip-on-fg, #3b5bfd);
  border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .4));
  background: var(--dks-chip-on-bg, rgba(77, 107, 254, .06));
}

.dks-res-item {
  margin-top: 10px;
  padding: 10px 14px;
  width: 100%;
  box-sizing: border-box;
  border-radius: 10px;
  border: 1px solid var(--dks-hairline, rgba(0, 0, 0, .07));
  background: var(--dks-res-bg, rgba(255, 255, 255, .6));
  animation: dksIn .26s var(--dks-ease) both;
}
.dks-res-site {
  font-size: 11px;
  line-height: 15px;
  color: var(--dks-chip-on-fg, #3b5bfd);
  letter-spacing: .01em;
}
.dks-res-title {
  font-size: 13px;
  line-height: 19px;
  color: var(--dks-text, #0d0d0d);
  margin: 1px 0 3px;
}
.dks-res-snip {
  font-size: 11.5px;
  line-height: 17px;
  color: var(--dks-text-3, #a3a3a3);
}

/* ================= 21. 流式输出光标 ================= */
.dks-bubble.dks-streaming::after {
  content: "▍";
  margin-left: 2px;
  color: var(--dks-chip-on-fg, #3b5bfd);
  animation: dksCaret 1s steps(1) infinite;
}
@keyframes dksCaret { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

/* ================= 22. 侧栏工具按钮 ================= */
.dks-tools {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--dks-hairline, rgba(0, 0, 0, .06));
}
.dks-tool {
  flex: 1;
  font: inherit;
  font-size: 12px;
  line-height: 18px;
  padding: 5px 8px;
  border-radius: 8px;
  border: 1px solid var(--dks-chip-line, rgba(0, 0, 0, .12));
  background: var(--dks-chip-bg, #fff);
  color: var(--dks-chip-fg, #4c4c4c);
  cursor: pointer;
  transition: background-color .15s var(--dks-ease), border-color .15s var(--dks-ease), color .15s var(--dks-ease);
}
.dks-tool:hover {
  background: var(--dks-chip-hover, #eef1f8);
  border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .4));
  color: var(--dks-chip-on-fg, #3b5bfd);
}
.dks-tool.is-done {
  color: #16a34a;
  border-color: rgba(22, 163, 74, .45);
}
/* ================= 23. 已读回执 ================= */
.dks-colme {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  min-width: 0;
  max-width: min(560px, 78%);
}
.dks-me .dks-bubble { max-width: 100%; }
.dks-seen {
  font-size: 10.5px;
  line-height: 14px;
  color: var(--dks-text-3, #a3a3a3);
  padding-right: 4px;
  letter-spacing: .02em;
  transition: color .3s var(--dks-ease);
}
.dks-seen.is-read { color: var(--dks-chip-on-fg, #3b5bfd); }
.dks-seen.is-read::before { content: "✓ "; }

/* ================= 24. 真链接 ================= */
.dks-res-title a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color .15s var(--dks-ease), border-color .15s var(--dks-ease);
}
.dks-res-title a:hover {
  color: var(--dks-chip-on-fg, #3b5bfd);
  border-bottom-color: currentColor;
}
.dks-res-item::after {
  content: "在新标签页打开 ↗";
  display: inline-block;
  font-size: 10.5px;
  color: var(--dks-text-3, #a3a3a3);
  opacity: 0;
  transition: opacity .15s var(--dks-ease);
}
.dks-res-item:hover::after { opacity: .8; }

/* ================= 25. 摊牌气泡 ================= */
.dks-bubble.dks-truth {
  border: 1px solid rgba(228, 119, 61, .45);
  background: var(--dks-truth-bg, #fff7ef);
  color: #8a4b18;
}
html[data-dks-theme="dark"] body .dks-bubble.dks-truth {
  --dks-truth-bg: rgba(228, 119, 61, .12);
  color: #e6b184;
}

/* ================= 26. 深度发呆思维链 ================= */
.dks-cot {
  margin: 0 0 10px;
  border: 1px solid var(--dks-line, #ececec);
  border-radius: 10px;
  background: var(--dks-bg-soft, #fafafa);
  overflow: hidden;
}
.dks-cot summary {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  font-size: 12.5px;
  line-height: 18px;
  color: var(--dks-text-2, #666);
  cursor: pointer;
  list-style: none;
  user-select: none;
}
.dks-cot summary::-webkit-details-marker { display: none; }
.dks-cot summary:hover { color: var(--dks-text, #0d0d0d); }
.dks-cot-arrow {
  width: 0; height: 0;
  border: 4px solid transparent;
  border-left-color: var(--dks-text-3, #999);
  margin-left: 2px;
  transition: transform .18s ease;
}
.dks-cot[open] .dks-cot-arrow { transform: rotate(90deg); }
.dks-cot.is-live .dks-cot-label { color: var(--dks-accent, #4d6bfe); }
.dks-cot.is-live .dks-cot-label::after {
  content: '';
  display: inline-block;
  width: 1px; height: 12px;
  margin-left: 3px;
  vertical-align: -2px;
  background: var(--dks-accent, #4d6bfe);
  animation: dksCaret 1s steps(1) infinite;
}
.dks-cot-body {
  padding: 2px 12px 10px 14px;
  border-top: 1px dashed var(--dks-line, #ececec);
}
.dks-cot-body p {
  margin: 6px 0;
  padding-left: 9px;
  border-left: 2px solid var(--dks-line, #e5e5e5);
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--dks-text-2, #5a5a5a);
  animation: dksCotIn .24s ease both;
}
.dks-before { display: block; }
@media (prefers-reduced-motion: reduce) {
  .dks-cot-body p,
  .dks-cot.is-live .dks-cot-label::after { animation: none; }
}
/* ================= 27. 忠实覆盖：对话区对齐真站令牌 ================= */
/* 消息栏沿用真站 .a2f8e4bb：max-width 800px + 64px 内边距，与输入卡同宽 */
.dks-msgs { gap: 22px; padding: 14px 0 24px; }
.dks-chat .dks-msgs { padding-top: 64px; scroll-padding-top: 64px; }

/* 行：助手通栏纯文本，无头像无气泡 */
.dks-row { display: block; }
.dks-bot {
  font-size: var(--ds-font-size-l, 16px);
  line-height: var(--ds-line-height-l, 28px);
  color: var(--dks-text, #0d0d0d);
}
.dks-col { max-width: 100%; gap: 4px; }
.dks-bot .dks-bubble {
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 0;
  max-width: 100%;
  font-size: inherit;
  line-height: inherit;
}
.dks-answer { word-break: break-word; white-space: pre-wrap; }

/* 用户消息：右对齐浅灰卡片（真站 --dsr-input-bg + .5px 描边 + 24px 圆角） */
.dks-me {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.dks-me .dks-bubble {
  max-width: 78%;
  background: var(--dsr-input-bg, rgb(243, 244, 246));
  box-shadow: 0 0 0 .5px var(--dsr-input-border, #dce0e9);
  border: 0;
  border-radius: 24px;
  padding: 8px 16px;
  color: var(--dks-text, #0d0d0d);
  font-size: var(--ds-font-size-l, 16px);
  line-height: var(--ds-line-height-l, 28px);
}
.dks-mefoot { display: flex; align-items: center; gap: 4px; padding-right: 2px; }
.dks-seen { font-size: 11px; line-height: 15px; color: var(--dks-text-3, #a3a3a3); }

/* 操作行：悬停出现的图标按钮（真站 function-row 行为） */
.dks-actions { gap: 2px; margin-top: var(--function-row-offset, 2px); min-height: 26px; }
.dks-act {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 7px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--dks-text-3, #a3a3a3);
  font: inherit;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  transition: background-color .15s var(--dks-ease), color .15s var(--dks-ease), opacity .15s var(--dks-ease);
}
.dks-act svg { width: 14px; height: 14px; flex: 0 0 14px; display: block; }
.dks-act:hover { background: var(--dks-icon-hover, rgba(0, 0, 0, .05)); color: var(--dks-text-2, #666); }
.dks-act:focus-visible { outline: 2px solid var(--dks-focus-ring, rgba(77, 107, 254, .7)); outline-offset: 1px; }
.dks-act.is-done { color: #16a34a; opacity: 1; }
.dks-act--icon { opacity: 0; }
.dks-row:hover .dks-act--icon, .dks-act--icon:focus-visible { opacity: 1; }
@media (hover: none) { .dks-act--icon { opacity: 1; } }
.dks-act--retry {
  color: var(--dks-chip-on-fg, #3b5bfd);
  background: var(--dks-chip-on-bg, rgba(77, 107, 254, .08));
}
.dks-act--retry:hover { background: var(--dks-chip-on-hover, rgba(77, 107, 254, .16)); color: var(--dks-chip-on-fg, #3b5bfd); }
.dks-meta { font-size: 11.5px; line-height: 16px; color: var(--dks-text-3, #a3a3a3); margin-right: 6px; }

/* 思考块：真站灰底圆角框，header「已思考 X 秒」 */
.dks-cot {
  margin: 0 0 12px;
  border: 1px solid var(--dks-cot-line, rgba(0, 0, 0, .07));
  border-radius: 12px;
  background: var(--dks-cot-bg, #f8f9fa);
}
.dks-cot summary { padding: 8px 13px; font-size: 13px; line-height: 21px; }
.dks-cot-body {
  padding: 0 14px 12px;
  border-top: 1px solid var(--dks-cot-line, rgba(0, 0, 0, .07));
}
.dks-cot-body p {
  margin: 7px 0;
  padding-left: 10px;
  border-left: 2px solid var(--dks-cot-line, rgba(0, 0, 0, .1));
  font-size: 13px;
  line-height: 22px;

/* 会话操作菜单 */

}

.dks-conv-menu-sep {

}
/* 头像图片 + 菜单分隔线 */

}

}
/* ================= 32. 附件芯片 ================= */
.dks-attach { display: flex; flex-wrap: wrap; gap: 6px; }
.dks-attach.has-file { margin-bottom: 8px; }

.dks-file-chip {
  display: inline-flex;

  color: var(--dsr-text-1, #262626);
}
.dks-file-chip img {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 8px;
  object-fit: cover;
  display: block;
}
.dks-file-ic {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--dks-cot-bg, #f4f5f8);
}
.dks-file-name {
  max-width: 220px;
  white-space: nowrap;

}
.dks-file-size { color: var(--dks-text-3, #a3a3a3); font-variant-numeric: tabular-nums; }
.dks-file-x {
  width: 20px;
  height: 20px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--dks-text-3, #a3a3a3);

  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.dks-file-x:hover { background: rgba(0, 0, 0, .06); color: var(--dsr-text-1, #262626); }

/* 消息里的附件（在气泡上方右对齐） */
.dks-file-chip--msg { align-self: flex-end; margin-bottom: 4px; }
/* ================= 33. 内容列宽与底部间距对齐真站新版 ================= */
/* 真站新版：--message-list-max-width:840px，水平内边距 32px → 内容 776px */
.a2f8e4bb {
  max-width: 840px;
  padding-left: 32px;
  padding-right: 32px;
  padding-bottom: 8px;
}
/* 顶栏 56px + 8px 呼吸 */
.dks-chat .dks-msgs { padding-top: 64px; scroll-padding-top: 64px; }
/* 页脚更贴底 */
.d9fb9344 { padding: 10px 16px 6px; }
/* 重试图标：常显但有底色，表明是主要操作 */
.dks-act--retry { opacity: 1; }
/* ================= 34. 右侧：本对话内容（小气泡，最多 9 条） ================= */
.dks-peek {
  position: fixed;
  top: 56px;
  bottom: 0;
  right: 22px;
  width: 20px;
  z-index: 9500;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 0;
  box-sizing: border-box;
  cursor: pointer;
}
.dks-peek { display: flex; }
.dks-peek-dash {
  display: block;
  width: 9px;
  height: 2px;
  border-radius: 1px;
  background: var(--dks-text-3, #a3a3a3);
  opacity: .5;
  flex: 0 0 auto;
}
.dks-peek:hover .dks-peek-dash { opacity: .85; }
/* 气泡打开后，横杠由气泡内部接管（跟着内容一起滚） */
.dks-peek.is-open .dks-peek-dash { opacity: 0; }


.dks-peek-dash.is-current {
  width: 16px;
  height: 3px;
  background: var(--dsr-main, #4d6bfe);
  opacity: 1;
}
.dks-peek.is-open .dks-peek-dash.is-current { opacity: 0; }



/* 小气泡：垂直居中、右侧浮出、宽度自适应、最多 9 条可滚 */
.dks-peek-panel {
  position: fixed;
  top: 56px;
  bottom: 0;
  right: 12px;
  margin: auto 0;
  height: fit-content;
  z-index: 9490;
  width: 232px;
  max-height: 270px;
  display: flex;
  flex-direction: column;
  padding: 6px;
  box-sizing: border-box;
  border-radius: 14px;
  background: var(--dks-mini-bg, #1e2126);
  border: 1px solid var(--dks-mini-line, rgba(255, 255, 255, .1));
  box-shadow: 0 12px 36px -12px rgba(0, 0, 0, .55);
  transform: translateX(120%);
  opacity: 0;
  pointer-events: none;
  transition: transform .2s var(--dks-ease), opacity .2s var(--dks-ease);
}
.dks-peek-panel.is-open { transform: none; opacity: 1; pointer-events: auto; }

.dks-peek-list {
  overflow-y: auto;
  scrollbar-width: thin;
  display: flex;
  flex-direction: column;
  gap: 0;
  max-height: 270px;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
}
.dks-peek-item { scroll-snap-align: start; }
.dks-peek-list::-webkit-scrollbar { width: 4px; }
.dks-peek-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); border-radius: 2px; }

.dks-peek-item {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 20px;
  color: var(--dks-text-2, #b8bcc6);
  cursor: pointer;
  justify-content: flex-end;
  gap: 8px;
}
.dks-peek-mark {
  flex: 0 0 9px;
  width: 9px;
  height: 2px;
  border-radius: 1px;
  background: currentColor;
  opacity: .55;
}
.dks-peek-item:hover .dks-peek-mark { opacity: .85; }
.dks-peek-item.is-current .dks-peek-mark {
  flex-basis: 14px;
  width: 14px;
  height: 3px;
  background: var(--dsr-main, #4d6bfe);
  opacity: 1;
}
.dks-peek-item:hover { background: var(--dsr-side-hover-bg, rgba(255, 255, 255, .06)); color: var(--dks-text, #e8eaef); }
.dks-peek-item.is-current { color: var(--dsr-main, #4d6bfe); }
.dks-peek-title {
  flex: 0 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: right;
}

/* 跳转后高亮 */
.dks-flash { animation: dksFlash 1.1s ease-out; border-radius: 12px; }
@keyframes dksFlash {
  0% { background: rgba(77, 107, 254, .16); }
  100% { background: transparent; }
}
/* 复制按钮常显（其余图标仍悬停出现） */
.dks-act--always { opacity: 1; }
.dks-act--always:hover { background: var(--dks-icon-hover, rgba(0, 0, 0, .05)); }
/* 回答分页器（1/2 ‹ ›） */
.dks-pager {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 26px;
  padding: 0 2px;
  border-radius: 7px;
}
.dks-pg {
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--dks-text-3, #a3a3a3);

  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.dks-pg:hover:not(:disabled) { background: var(--dks-icon-hover, rgba(0, 0, 0, .05)); color: var(--dsr-text-1, #262626); }
.dks-pg:disabled { opacity: .35; cursor: default; }
.dks-pg-num {

  min-width: 26px;

}
/* 停止生成按钮：蓝色圆 + 正中白色方块 */
.dks-stop-btn {
  background: var(--dsr-main, #4d6bfe) !important;
  cursor: pointer !important;
}
.dks-stop-btn:hover { background: #4166d5 !important; }
.dks-stop-btn .f286936b { position: relative; }
.dks-stop-btn .f286936b svg { display: none; }
.dks-stop-btn .f286936b::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 11px;
  height: 11px;
  border-radius: 2.5px;
  background: #fff;
}

/* 编辑中的用户消息提示 */
.dks-row.is-editing .dks-bubble {
  box-shadow: 0 0 0 2px var(--dsr-main, #4d6bfe);
}
.dks-edit-hint {
  margin: 0 0 8px;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--dks-chip-on-fg, #3b5bfd);
  background: var(--dks-chip-on-bg, rgba(77, 107, 254, .08));

}
.dks-edit-hint[hidden] { display: none; }
/* 删除确认弹窗 */
.dks-confirm .dks-confirm-card {
  box-sizing: border-box;
  width: min(376px, 100%);
  padding: 22px 22px 16px;
  border-radius: 16px;
  background: var(--dsr-bg, #fff);

}
.dks-confirm-cancel,
.dks-confirm-ok,
.dks-confirm-go {

  font-size: 13px;
  line-height: 20px;
  height: 34px;
  padding: 0 16px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
}
.dks-confirm-cancel {

.dks-confirm-ok {

}
.dks-confirm-ok:hover { background: #d33d42; }
.dks-confirm-go {

.dks-confirm-ok:focus-visible,
.dks-confirm-go:focus-visible,

  outline: 2px solid var(--dks-focus-ring, rgba(77, 107, 254, .7));

}
/* ================= 34b. 演示链接（?demo=问题） ================= */

/* ================= 35. 多选模式（一起删除 / 一同置顶） ================= */
.dks-sels {
  flex-shrink: 0;
  box-sizing: border-box;
  margin: 8px 0 2px;

  background: var(--dks-chip-bg, #fff);

  gap: 8px;
  animation: dksIn .2s var(--dks-ease) both;
}
.dks-sels[hidden] { display: none; }
.dks-sels-row { display: flex; align-items: center; gap: 8px; }
.dks-sels-all {

  font-size: 12px;
  line-height: 18px;

.dks-sels-all:hover { color: var(--dks-chip-on-fg, #3b5bfd); border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .4)); }
.dks-sels-all.is-on {
  color: #fff;

  border-color: transparent;
}
.dks-sels-count {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--dks-text-3, #a3a3a3);

  text-overflow: ellipsis;
}
.dks-sels-x {
  font: inherit;
  font-size: 12px;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 7px;

}

.dks-sels-acts { display: flex; gap: 6px; }
.dks-sels-btn {
  flex: 1;
  font: inherit;
  font-size: 12px;
  line-height: 17px;
  padding: 6px 4px;

  color: var(--dks-chip-fg, #4c4c4c);

}

.dks-sels-btn--danger:hover:not(:disabled) {

}

/* 选择态的会话行 */
.dks-selecting .dks-sb-new { display: none; }
.dks-selecting .dks-conv { padding-left: 32px; }
.dks-selecting .dks-conv.is-pinned { padding-right: 34px; }

.dks-conv-check {

  align-items: center;

}
.dks-conv-check:hover { border-color: var(--dsr-main, #4d6bfe); }

.dks-conv.is-sel { background: var(--dks-chip-on-bg, rgba(77, 107, 254, .1)); }

/* 头部多选按钮选中态 */

/* ================= 36. 多引擎搜索结果 ================= */
.dks-res-via {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  border-radius: 4px;
  font-size: 10.5px;
  line-height: 15px;
  color: var(--dks-text-2, #666);
  background: var(--dks-icon-hover, rgba(0, 0, 0, .05));
}
.dks-res-engines {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed var(--dks-hairline, rgba(0, 0, 0, .1));
}
.dks-res-elabel { color: var(--dks-text-3, #a3a3a3); font-size: 11.5px; }
.dks-res-eng {
  font-size: 11.5px;
  line-height: 18px;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--dks-chip-line, rgba(0, 0, 0, .12));
  color: var(--dks-chip-fg, #4c4c4c);
  background: transparent;
  text-decoration: none;
  transition: color .15s var(--dks-ease), border-color .15s var(--dks-ease), background-color .15s var(--dks-ease);
}
.dks-res-eng:hover {
  color: var(--dks-chip-on-fg, #3b5bfd);
  border-color: var(--dks-chip-on-line, rgba(77, 107, 254, .45));
  background: var(--dks-chip-on-bg, rgba(77, 107, 254, .07));
}
.dks-res-note {
  margin-top: 7px;
  font-size: 11px;
  line-height: 16px;
  color: var(--dks-text-3, #a3a3a3);
  font-style: normal;
}

/* ================= 37. 删除失败 / 轻提示 ================= */
.dks-confirm-err {
  margin: -8px 0 16px;
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 12.5px;
  line-height: 18px;
  color: var(--dks-delerr-fg, #b4483f);
  background: var(--dks-delerr-bg, rgba(229, 72, 77, .09));
  border: 1px solid var(--dks-delerr-line, rgba(229, 72, 77, .3));
}
.dks-confirm-err[hidden] { display: none; }
.dks-shake { animation: dksShake .3s var(--dks-ease) both; }
@keyframes dksShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
.dks-toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 12px);
  z-index: 10002;
  max-width: min(420px, calc(100vw - 32px));
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 13px;
  line-height: 19px;
  color: #fff;
  background: var(--dks-mini-bg, #1e2126);
  border: 1px solid var(--dks-mini-line, rgba(255, 255, 255, .1));
  box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .6);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--dks-ease), transform .2s var(--dks-ease);
}
.dks-toast.is-open { opacity: 1; transform: translate(-50%, 0); }
.dks-toast--busy { color: #ffd9d5; }
@media (prefers-reduced-motion: reduce) {
  .dks-shake, .dks-sels { animation: none; }
}</style></head>

(function () {

    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle fill="none" cx="12" cy="12" r="4.3"/><path fill="none" d="M12 2.8v1.9M12 19.3v1.9M2.8 12h1.9M19.3 12h1.9M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path fill="none" d="M20.2 14.3A8.6 8.6 0 1 1 9.7 3.8a6.9 6.9 0 0 0 10.5 10.5z"/></svg>'
  };
  var mode = store.get('dks-theme');
  if (MODES.indexOf(mode) < 0) mode = 'auto';
  if (MODES.indexOf(qs.theme) >= 0) mode = qs.theme;
  var themeBtn = null;
  var mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function resolveTheme(m) {
    return m === 'auto' ? (mqDark && mqDark.matches ? 'dark' : 'light') : m;
  }
  /* 单一来源：auto 也解析成 dark/light 写到同一个属性上，

  function applyTheme(m) {
    root.setAttribute('data-dks-theme', resolveTheme(m));
    if (themeBtn) {

  }
  if (mqDark) {
    var onSchemeChange = function () { if (mode === 'auto') applyTheme(mode); };
    if (mqDark.addEventListener) mqDark.addEventListener('change', onSchemeChange);

  /* ================= 元素 ================= */
  var side = document.querySelector('.a7f3a288');

  var ta = document.getElementById('chat-input');

  var mirror = document.querySelector('.cefa5c26 .b13855df');

  var msgsEl = null;
  /* 侧栏图标按钮：id 落在 svg 内部的 rect 上，必须向上找 .ds-icon-button */
  function railButton(prefix) {

  var railToggle = railButton('打开边栏');

  var infoBtn = document.querySelector('.b91228e4');

  var chips = Array.prototype.slice.call(document.querySelectorAll('.d9f56c96'));
  var chipS1 = chips[0] || null;

  /* 侧栏底部：主题按钮插在占位弹簧之后 */
  if (side) {

    else side.appendChild(themeBtn);
    themeBtn.addEventListener('click', function () {
      mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];

  /* 用户头像位（原本是空 div） */
  if (avatarSlot) {

  /* 欢迎区：标题上方的大鲸鱼 */
  (function greetMark() {

    var svg = mkMark(true);

  /* ================= 会话数据 ================= */
  var KEY = 'dks-chats-v1';
  var db = { convs: [], active: null };

  /* ---- 本会话累计思考时长（只用于摊牌文案，不做成 UI） ---- */
  function wasteText(c) {
    var ms = (c && c.thinkMs) || 0;
    if (ms < 60000) return Math.round(ms / 1000) + ' 秒';
    return (ms / 60000).toFixed(1) + ' 分钟';
  }
  (function load() {
    try {
      var raw = store.get(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && Array.isArray(o.convs)) {
        db.convs = o.convs.filter(function (c) { return c && c.id && Array.isArray(c.msgs); });
        db.active = o.active;
      }
    } catch (e) {}
  })();
  function save() {
    try { store.set(KEY, JSON.stringify({ convs: db.convs, active: db.active })); } catch (e) {}
  }
  function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function cur() {
    for (var i = 0; i < db.convs.length; i++) if (db.convs[i].id === db.active) return db.convs[i];
    return null;
  }
  function newConv() {
    var c = { id: uid(), title: '新对话', msgs: [], attempt: 0, updated: Date.now(), pinned: false };
    db.convs.unshift(c);

    return c;

  /* 置顶在前，组内都按最后一次聊天时间倒序 */
  function sortedConvs(src) {

      var pa = a.pinned ? 1 : 0, pb = b.pinned ? 1 : 0;

      return (b.updated || 0) - (a.updated || 0);

  }

    return null;
  }

  (function dedupeEmpty() {

      .sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });
    if (empties.length <= 1) return;
    var keep = empties[0], drop = {};
    empties.slice(1).forEach(function (c) { drop[c.id] = 1; });
    db.convs = db.convs.filter(function (c) { return !drop[c.id]; });
    if (!db.active || drop[db.active]) db.active = keep.id;
    save();
  })();

  /* ================= 文案 ================= */
  var IDLE_PH = '给 DickSip 发送消息';
  var BUSY_LINES = [
    '服务器繁忙，请稍后再试。',

  ];  var CANCEL_LINES = [

  /* ================= 渲染 ================= */
  function ensureMsgs() {
    if (msgsEl || !list) return msgsEl;

  function mkMark(big) {

  function resultsBlock(list) {

    return d;
  }
  function questionOf(c, idx) {
    for (var i = idx - 1; i >= 0; i--) if (c.msgs[i].r === 'me') return c.msgs[i].t;
    return '';
  }
  function bubbleRow(m, idx, total, sel, meIdx) {
    var c = cur();
    var row = document.createElement('div');
    row.className = 'dks-row ' + (m.r === 'me' ? 'dks-me' : 'dks-bot');
    row.setAttribute('data-i', idx);

    var bubble = document.createElement('div');
    bubble.className = 'dks-bubble';
    var answerNode = null;

    if (m.typing) {
      bubble.classList.add('dks-typing', 'dks-searching');

    if (!m.typing) {

        wrap.className = 'dks-before';
        wrap.appendChild(cotBlock(m, false));

      }
      answerNode = document.createElement('div');
      answerNode.className = 'dks-answer';
      if (m.r === 'me') answerNode.textContent = meText(m);

      answerNode.classList.add('dks-streaming');
      streamNode = answerNode;
    }
    if (m.breakdown) bubble.classList.add('dks-truth');

    if (m.r === 'me') {
      row.appendChild(bubble);
      if (m.file) {
        var card2 = document.createElement('div');
        card2.className = 'dks-file-chip dks-file-chip--msg';
        if (m.file.thumb) {
          var im2 = document.createElement('img');
          im2.src = m.file.thumb;
          im2.alt = '';
          card2.appendChild(im2);
        } else {
          var ic2 = document.createElement('span');
          ic2.className = 'dks-file-ic';
          ic2.textContent = '📄';
          card2.appendChild(ic2);
        }
        var nm2 = document.createElement('span');
        nm2.className = 'dks-file-name';

      }
      var foot = document.createElement('div');
      foot.className = 'dks-mefoot';
      var seen = document.createElement('span');
      seen.className = 'dks-seen' + (m.seen ? ' is-read' : '');
      seen.textContent = m.seen ? '已读' : '已发送';
      foot.appendChild(seen);
      var ed = actBtn('pencil', '编辑问题', function () { editQuestion(typeof m.i === 'number' ? m.i : meIdx); }, 'dks-act--always');
      foot.appendChild(ed);
      var vers = m.versions || [];
      if (vers.length) {
        var vsel = typeof m.vsel === 'number' ? m.vsel : vers.length;
        var vpg = document.createElement('span');
        vpg.className = 'dks-pager';
        var vp = document.createElement('button');
        vp.type = 'button';
        vp.className = 'dks-pg';
        vp.textContent = '‹';
        vp.setAttribute('aria-label', '上一个问题版本');
        vp.disabled = vsel <= 0;
        vp.addEventListener('click', function () { pickQuestion(meIdx, vsel - 1); });
        var vn = document.createElement('span');
        vn.className = 'dks-pg-num';
        vn.textContent = (vsel + 1) + '/' + (vers.length + 1);
        var vx = document.createElement('button');
        vx.type = 'button';
        vx.className = 'dks-pg';
        vx.textContent = '›';
        vx.setAttribute('aria-label', '下一个问题版本');
        vx.disabled = vsel >= vers.length;
        vx.addEventListener('click', function () { pickQuestion(meIdx, vsel + 1); });
        vpg.appendChild(vp);
        vpg.appendChild(vn);
        vpg.appendChild(vx);
        foot.appendChild(vpg);
      }
      foot.appendChild(copyAct(m.t));
      row.appendChild(foot);
      return row;
    }

    var col = document.createElement('div');
    col.className = 'dks-col';
    var actions = document.createElement('div');
    actions.className = 'dks-actions';
    if (m.meta) {
      var meta = document.createElement('span');
      meta.className = 'dks-meta';
      meta.textContent = m.meta;
      actions.appendChild(meta);
    }
    if (m.typing) {
      /* 搜索中不显示操作行 */
      col.appendChild(bubble);
      row.appendChild(col);
      return row;
    }
    actions.appendChild(copyAct(function () { return m.t; }));
    if (total && total > 1) {
      var pg = document.createElement('span');
      pg.className = 'dks-pager';
      var prev = document.createElement('button');
      prev.type = 'button';
      prev.className = 'dks-pg';
      prev.textContent = '‹';
      prev.setAttribute('aria-label', '上一条回答');
      prev.disabled = sel <= 0;
      prev.addEventListener('click', function () { pickAnswer(meIdx, sel - 1); });
      var num = document.createElement('span');
      num.className = 'dks-pg-num';
      num.textContent = (sel + 1) + '/' + total;
      var next = document.createElement('button');
      next.type = 'button';
      next.className = 'dks-pg';
      next.textContent = '›';
      next.setAttribute('aria-label', '下一条回答');
      next.disabled = sel >= total - 1;
      next.addEventListener('click', function () { pickAnswer(meIdx, sel + 1); });
      pg.appendChild(prev);
      pg.appendChild(num);
      pg.appendChild(next);
      actions.appendChild(pg);
    }
    /* 重试：唯一的重生成入口（图标形式，和真站一致） */
    if (!m.breakdown) {
      actions.appendChild(actBtn('retry', '重试', function () { retryLast(idx); }, 'dks-act--retry'));
    }
    actions.appendChild(actBtn('up', '赞', function (e) { vote(m, 'up', e.currentTarget); }));
    actions.appendChild(actBtn('down', '踩', function (e) { vote(m, 'down', e.currentTarget); }));
    if (!m.breakdown) {
      actions.appendChild(actBtn('share', '分享', function (e) {
        var base = location.href.split('?')[0].split('#')[0];
        copyText(base + (questionOf(c, idx) ? '?demo=' + encodeURIComponent(questionOf(c, idx)) : ''), e.currentTarget);
        toast('演示链接已复制 · 对方打开要先点确认，也不会写进对方记录');

          '<button type="button" class="dks-sb-cap" data-act="new" aria-label="新建对话" title="新建对话（Ctrl K）">＋</button>' +

        '<span>开启新对话</span>' +
      '</div>' +
      '<div class="dks-sb-scroll">' +
        '<input type="search" class="dks-search" placeholder="搜索对话" autocomplete="off">' +

      '</div>' +
      '<div class="dks-sels" hidden>' +
        '<div class="dks-sels-row">' +
          '<button type="button" class="dks-sels-all" data-act="all">全选</button>' +
          '<span class="dks-sels-count">已选 0 项</span>' +
          '<button type="button" class="dks-sels-x" data-act="exit" title="退出多选（Ctrl M）" aria-label="退出多选">✕</button>' +
        '</div>' +
        '<div class="dks-sels-acts">' +
          '<button type="button" class="dks-sels-btn" data-act="pin">一同置顶</button>' +
          '<button type="button" class="dks-sels-btn" data-act="unpin">取消置顶</button>' +
          '<button type="button" class="dks-sels-btn dks-sels-btn--danger" data-act="del">一起删除</button>' +
        '</div>' +
      '</div>' +
      '<div class="dks-sb-foot">' +
        '<div class="dks-user" role="button" tabindex="0" aria-haspopup="menu">' +
          '<span class="dks-user-ava"></span>' +
          '<span class="dks-user-name"></span>' +
          '<span class="dks-user-chev">›</span>' +
        '</div>' +
        '<div class="dks-user-menu" hidden>' +
          '<button type="button" class="dks-um-item" data-act="rename">修改昵称</button>' +
          '<button type="button" class="dks-um-item" data-act="avatar">更换头像</button>' +
          '<button type="button" class="dks-um-item" data-act="reset-avatar">恢复默认头像</button>' +
          '<div class="dks-um-sep"></div>' +
          '<button type="button" class="dks-um-item" data-act="export">导出对话</button>' +
          '<button type="button" class="dks-um-item" data-act="share">分享链接</button>' +
          '<button type="button" class="dks-um-item" data-act="theme">主题：跟随系统</button>' +
          '<label class="dks-um-item dks-um-switch"><input type="checkbox" class="dks-switch-input">真实联网搜索</label>' +
          '<button type="button" class="dks-um-item" data-act="about">关于 DickSip</button>' +
        '</div>' +
      '</div>';

    panelList = panel.querySelector('.dks-list');
    var headMark = panel.querySelector('.dks-sb-brand .dks-brand-mark');
    var headSvg = mkMark(true);
    if (headMark && headSvg) headMark.appendChild(headSvg);
    var searchEl = panel.querySelector('.dks-search');
    searchEl.addEventListener('input', function () {
      sideFilter = searchEl.value.trim();
      renderSidebar();
    });
    searchEl.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { searchEl.value = ''; sideFilter = ''; renderSidebar(); searchEl.blur(); e.stopPropagation(); }
    });

    panel.querySelector('[data-act="new"]').addEventListener('click', function () { newChat(); });
    panel.querySelector('[data-act="collapse"]').addEventListener('click', function () { setSide(false); });

    /* ---- 多选：开关 + 选择栏 ---- */
    selsBar = panel.querySelector('.dks-sels');
    panel.querySelector('[data-act="select"]').addEventListener('click', function (e) {
      e.stopPropagation();
      setSelMode(!selMode);
    });
    selsBar.querySelector('[data-act="exit"]').addEventListener('click', function () { setSelMode(false); });
    selsBar.querySelector('[data-act="all"]').addEventListener('click', function () {
      var vis = visibleConvs();
      var all = selIds().length >= vis.length && vis.length > 0;
      if (all) { selected = {}; }
      else {
        selected = {};
        vis.forEach(function (c) { selected[c.id] = 1; });
      }
      renderSidebar();
    });
    selsBar.querySelector('[data-act="pin"]').addEventListener('click', function () {
      var ids = selIds();
      if (ids.length) pinMany(ids, true);
    });
    selsBar.querySelector('[data-act="unpin"]').addEventListener('click', function () {
      var ids = selIds();
      if (ids.length) pinMany(ids, false);
    });
    selsBar.querySelector('[data-act="del"]').addEventListener('click', function () {
      var ids = selIds();
      if (ids.length) delMany(ids);
    });

    var newRow = panel.querySelector('.dks-sb-new');
    newRow.addEventListener('click', function () { newChat(); });
    newRow.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); newChat(); }
    });

    panel.querySelector('[data-act="export"]').addEventListener('click', function () {
      exportChat();
      closeUserMenu();
    });
    panel.querySelector('[data-act="share"]').addEventListener('click', function (e) {
      var c = cur();
      var q = '';
      if (c) for (var i = 0; i < c.msgs.length; i++) { if (c.msgs[i].r === 'me') { q = c.msgs[i].t; break; } }
      var base = location.href.split('?')[0].split('#')[0];
      copyText(base + (q ? '?demo=' + encodeURIComponent(q) : ''), e.currentTarget);
      toast('演示链接已复制 · 对方打开要先点确认，也不会写进对方记录');
    });
    panel.querySelector('[data-act="theme"]').addEventListener('click', function () {
      mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
      store.set('dks-theme', mode);
      applyTheme(mode);
      var lab = { auto: '跟随系统', light: '浅色', dark: '深色' }[mode] || mode;
      this.textContent = '主题：' + lab;
    });
    panel.querySelector('[data-act="about"]').addEventListener('click', function () {
      closeUserMenu();
      showAbout();
    });

    var sw = panel.querySelector('.dks-switch-input');
    sw.checked = realSearch;
    sw.addEventListener('change', function () {
      realSearch = sw.checked;
      store.set(REAL_KEY, realSearch ? '1' : '0');
      if (realSearch) toast('已联网：关键词会发给百度，答案还是我编的。');
      var chipWebEl = chipWeb;
      if (chipWebEl) chipWebEl.classList.toggle('dks-on', realSearch || chipWebEl.classList.contains('dks-on'));
    });

    var userRow = panel.querySelector('.dks-user');
    var userMenu = panel.querySelector('.dks-user-menu');

    function paintUser() {
      var ava = userRow.querySelector('.dks-user-ava');
      var nameEl = userRow.querySelector('.dks-user-name');
      nameEl.textContent = profile.name;
      ava.textContent = '';
      if (profile.avatar) {
        var img = document.createElement('img');
        img.src = profile.avatar;
        img.alt = '';
        ava.appendChild(img);
        ava.classList.add('has-img');
      } else {
        ava.textContent = (profile.name || '我').slice(0, 1);
        ava.classList.remove('has-img');
      }
      userRow.setAttribute('aria-label', '当前账号：' + profile.name);
    }
    paintUser();

    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.style.display = 'none';
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (f) importAvatar(f);
    });
    panel.appendChild(fileInput);

    function importAvatar(file) {
      if (!/^image\//.test(file.type)) { window.alert('请选一张图片。'); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var im = new Image();
        im.onload = function () {
          var size = 160;
          var c = document.createElement('canvas');
          c.width = size; c.height = size;
          var ctx = c.getContext('2d');
          var s = Math.min(im.width, im.height);
          ctx.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, size, size);
          profile.avatar = c.toDataURL('image/jpeg', 0.86);
          saveProfile();
          paintUser();
        };
        im.onerror = function () { window.alert('这张图读不出来，换一张。'); };
        im.src = reader.result;
      };
      reader.onerror = function () { window.alert('读取失败，可能是浏览器不让。'); };
      reader.readAsDataURL(file);
    }

    panel.querySelector('[data-act="rename"]').addEventListener('click', function () {
      var cur = profile.name;
      var name = window.prompt('你的昵称（最多 16 字）', cur);
      if (name === null) return;
      name = name.trim().slice(0, 16);
      if (!name) name = '封禁用户';
      profile.name = name;
      saveProfile();
      paintUser();
      closeUserMenu();
    });
    panel.querySelector('[data-act="avatar"]').addEventListener('click', function () {
      closeUserMenu();
      fileInput.click();
    });
    panel.querySelector('[data-act="reset-avatar"]').addEventListener('click', function () {
      profile.avatar = '';
      saveProfile();
      paintUser();
      closeUserMenu();
    });
    function closeUserMenu() { userMenu.hidden = true; }
    function toggleUserMenu() {
      userMenu.hidden = !userMenu.hidden;
      if (!userMenu.hidden) {
        var lab = { auto: '跟随系统', light: '浅色', dark: '深色' }[mode] || mode;
        var tb = userMenu.querySelector('[data-act="theme"]');
        if (tb) tb.textContent = '主题：' + lab;
      }
    }
    userRow.addEventListener('click', function (e) { e.stopPropagation(); toggleUserMenu(); });
    userRow.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleUserMenu(); }
      if (e.key === 'Escape') closeUserMenu();
    });
    document.addEventListener('click', function (e) {
      if (!userMenu.hidden && !userMenu.contains(e.target) && !userRow.contains(e.target)) closeUserMenu();
    });

    backdrop = document.createElement('div');
    backdrop.className = 'dks-backdrop';
    backdrop.addEventListener('click', function () { closePanel(); });

    document.getElementById('root').appendChild(backdrop);
    if (sideHost) sideHost.appendChild(panel);
    else { panel.classList.add('dks-side--drawer'); document.getElementById('root').appendChild(panel); }
  }
  var SIDE_KEY = 'dks-side-open';
  function sideNarrow() { return window.innerWidth < 768; }
  function sideIsOpen() {
    return sideHost ? !sideHost.classList.contains('a02af2e6')
                    : !!(panel && panel.classList.contains('is-open'));
  }
  function setSide(open) {
    if (!panel) buildPanel();
    if (sideHost) sideHost.classList.toggle('a02af2e6', !open);
    else panel.classList.toggle('is-open', open);
    document.body.classList.toggle('dks-side-collapsed', !open);
    if (open && peekPanel) { peekPanel.classList.remove('is-open'); peekZone.classList.remove('is-open'); }
    backdrop.classList.toggle('is-open', open && sideNarrow());
    store.set(SIDE_KEY, open ? '1' : '0');
    if (railToggle) railToggle.setAttribute('title', (open ? '收起边栏' : '展开边栏') + '（Ctrl B）');
    if (open) renderSidebar();
  }
  function openPanel() { setSide(true); }
  function closePanel() { setSide(false); }
  function togglePanel() { setSide(!sideIsOpen()); }

  function relTime(ts) {
    var d = Date.now() - ts;
    if (d < 60000) return '刚刚';
    if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
    return Math.floor(d / 86400000) + ' 天前';
  }

  var sideFilter = '';
  function bucketOf(ts) {
    var d = new Date();
    var startToday = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    if (ts >= startToday) return '今天';
    if (ts >= startToday - 86400000) return '昨天';
    if (ts >= startToday - 7 * 86400000) return '7 天内';
    return '更早';
  }

  /* ================= 多选（一起删除 / 一同置顶） ================= */
  var selMode = false;
  var selected = {};
  var selsBar = null;

  function selIds() {
    var out = [];
    visibleConvs().forEach(function (c) { if (selected[c.id]) out.push(c.id); });
    return out;
  }
  function visibleConvs() {
    var q = sideFilter.toLowerCase();
    return sortedConvs(q ? db.convs.filter(function (c) {
      return (c.title || '').toLowerCase().indexOf(q) >= 0;
    }) : db.convs);
  }
  function setSelMode(on) {
    if (on === selMode) return;
    selMode = on;
    if (!panel) buildPanel();
    if (!selsBar) selsBar = panel.querySelector('.dks-sels');
    selsBar.hidden = !on;
    panel.classList.toggle('dks-selecting', on);
    var b = panel.querySelector('[data-act="select"]');
    if (b) b.classList.toggle('is-on', on);
    if (!on) { selected = {}; }
    renderSidebar();
    /* 退出时也要把「已选 N 项」归零，免得下次进来先闪一个旧数字 */
    syncSelsBar();
  }
  function toggleSel(id) {
    if (selected[id]) { delete selected[id]; }
    else { selected[id] = 1; }
    renderSidebar();
  }
  function syncSelsBar() {
    if (!selsBar) selsBar = panel && panel.querySelector('.dks-sels');
    if (!selsBar) return;
    var vis = visibleConvs();
    var n = selIds().length;
    selsBar.querySelector('.dks-sels-count').textContent = '已选 ' + n + ' 项';
    var allBtn = selsBar.querySelector('[data-act="all"]');
    var all = vis.length > 0 && n >= vis.length;
    allBtn.textContent = all ? '取消全选' : '全选';
    allBtn.classList.toggle('is-on', all);
    ['pin', 'unpin', 'del'].forEach(function (a) {
      selsBar.querySelector('[data-act="' + a + '"]').disabled = n === 0;
    });
  }

  function toast(msg, kind) {
    var old = document.getElementById('dksToast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.id = 'dksToast';
    t.className = 'dks-toast' + (kind ? ' dks-toast--' + kind : '');
    t.setAttribute('role', 'status');
    t.textContent = msg;
    document.getElementById('root').appendChild(t);
    revealOpen(t);
    setTimeout(function () {
      t.classList.remove('is-open');
      setTimeout(function () { t.remove(); }, 220);
    }, 2600);
  }

  function pinMany(ids, on) {
    var n = 0;
    db.convs.forEach(function (c) {
      if (ids.indexOf(c.id) >= 0 && !!c.pinned !== on) { c.pinned = on; n++; }
    });
    save();
    renderSidebar();
    var msg;
    if (!n) {
      msg = on ? '这 ' + ids.length + ' 个对话已经全在置顶了。'
               : '这 ' + ids.length + ' 个对话本来就没置顶。';
    } else {
      var same = ids.length - n;
      msg = '已把 ' + n + ' 个对话' + (on ? '一同置顶' : '取消置顶') +
        (same > 0 ? '（另外 ' + same + ' 个本来就是那个状态，它没动）' : '');
    }
    toast(msg);
    /* 批量操作做完了，就不该继续挂着选择态 */
    if (selMode) setSelMode(false);
  }

  function delMany(ids) {
    var titles = [];
    db.convs.forEach(function (c) { if (ids.indexOf(c.id) >= 0) titles.push(c.title || '未命名'); });
    confirmDelete(titles, function () {
      delAttempt = 0;
      deleteConvs(ids);
      toast('已删除 ' + titles.length + ' 个对话');
      /* 真删掉了才收工；繁忙失败或取消时保留选择，方便再来一次 */
      if (selMode) setSelMode(false);
    });
  }

  function openConvMenu(c, anchor) {
    var old = document.querySelector('.dks-conv-menu');
    if (old) old.remove();
    var m = document.createElement('div');
    m.className = 'dks-conv-menu';
    m.setAttribute('role', 'menu');
    var del = document.createElement('button');
    del.type = 'button';
    del.setAttribute('data-danger', '1');
    del.textContent = '删除对话';
    del.addEventListener('click', function () {
      m.remove();
      confirmDelete([c.title || '未命名'], function () {
        delAttempt = 0;
        deleteConvs([c.id]);
      });
    });
    var pin = document.createElement('button');
    pin.type = 'button';
    pin.textContent = c.pinned ? '取消置顶' : '置顶';
    pin.addEventListener('click', function () {
      m.remove();
      c.pinned = !c.pinned;
      save();
      renderSidebar();
    });
    var ren = document.createElement('button');
    ren.type = 'button';
    ren.textContent = '重命名';
    ren.addEventListener('click', function () {
      m.remove();
      var name = window.prompt('重命名对话', c.title);
      if (name && name.trim()) {
        c.title = name.trim().slice(0, 40);
        c.updated = Date.now();
        save(); render();
      }
    });
    m.appendChild(pin);
    m.appendChild(ren);
    var selBtn = document.createElement('button');
    selBtn.type = 'button';
    selBtn.textContent = '多选…';
    selBtn.addEventListener('click', function () {
      m.remove();
      setSelMode(true);
      if (!selected[c.id]) { selected[c.id] = 1; }
      renderSidebar();
    });
    var sep = document.createElement('div');
    sep.className = 'dks-conv-menu-sep';
    m.appendChild(selBtn);
    m.appendChild(sep);
    m.appendChild(sep);
    m.appendChild(del);
    document.body.appendChild(m);
    var r = anchor.getBoundingClientRect();
    var mw = m.offsetWidth, mh = m.offsetHeight;
    var x = Math.min(r.right - mw + 8, window.innerWidth - mw - 8);
    var y = r.bottom + 4;
    if (y + mh > window.innerHeight - 8) y = r.top - mh - 4;
    m.style.left = Math.max(8, x) + 'px';
    m.style.top = Math.max(8, y) + 'px';
    setTimeout(function () {
      document.addEventListener('click', function close(ev) {
        if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('click', close); }
      });
    }, 0);
  }

  var PIN_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>';

  function convRow(c) {
    var a = document.createElement('div');
    a.className = 'dks-conv' + (c.id === db.active ? ' is-active' : '') + (c.pinned ? ' is-pinned' : '');
    a.setAttribute('role', 'button');
    a.setAttribute('tabindex', '0');
    var on = selMode && !!selected[c.id];
    if (on) a.classList.add('is-sel');

    if (selMode) {
      var box = document.createElement('span');
      box.className = 'dks-conv-check';
      box.setAttribute('role', 'checkbox');
      box.setAttribute('aria-checked', on ? 'true' : 'false');
      box.setAttribute('aria-label', '选择「' + (c.title || '未命名') + '」');
      box.tabIndex = 0;
      box.innerHTML = on
        ? '<svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.4l3.2 3.1L13 4.6"/></svg>'
        : '';
      box.addEventListener('click', function (ev) {
        ev.stopPropagation();
        toggleSel(c.id);
      });
      box.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); toggleSel(c.id); }
      });
      a.appendChild(box);
    }

    var t = document.createElement('span');
    t.className = 'dks-conv-title';
    t.textContent = c.title;

    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'dks-conv-more';
    more.title = '更多';
    more.setAttribute('aria-label', '更多操作');
    more.textContent = '⋯';
    more.addEventListener('click', function (ev) {
      ev.stopPropagation();
      openConvMenu(c, more);
    });

    if (c.pinned) {
      var pin = document.createElement('span');
      pin.className = 'dks-conv-pin';
      pin.title = '置顶';
      pin.innerHTML = PIN_SVG;
      a.appendChild(pin);
    }

    a.appendChild(t);
    a.appendChild(more);
    a.addEventListener('click', function () {
      if (selMode) { toggleSel(c.id); return; }
      if (busy && c.id !== db.active) return;
      db.active = c.id;
      save();
      render();
      if (sideNarrow()) closePanel();
      if (ta) ta.focus();
    });
    a.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); a.click(); }
    });
    return a;
  }

  function renderSidebar() {
    if (!panelList) return;
    var keepTop = panelList.scrollTop;
    panelList.textContent = '';

    var convs = visibleConvs();
    /* 过滤后可能有些勾选项已经不在列表里，同步计数 */
    if (selMode) {
      var alive = {};
      db.convs.forEach(function (c) { alive[c.id] = 1; });
      Object.keys(selected).forEach(function (id) { if (!alive[id]) { delete selected[id]; } });
    }

    if (selMode) syncSelsBar();

    if (!convs.length) {
      var empty = document.createElement('div');
      empty.className = 'dks-empty';
      empty.textContent = sideFilter ? '没有匹配的对话。搜也不会有的。' : '没有历史对话。我也没有。';

  /* ---- 搜索流程：分阶段 → 结果卡片 → 逐字吐出答案 ---- */

    setBusy(true, '正在联网搜索，别催…');
    syncSend();

    var results = randInt(20000, 4800000);

    var engRun = pickEngines(web ? 3 : 2);
    var engMain = engRun[0];

    if (realSearch) baiduSuggest(question, function (r) { sug = r; sugDone = true; });

    var steps = [
      { t: /搜索$/.test(engMain.name) ? '正在' + engMain.name + '中' : '正在' + engMain.name + '搜索', w: 6 },
      { t: '找到 ' + fmtNum(results) + ' 个结果', w: 5 },
      { t: '正在阅读第 1 条', w: 6 },
      { t: '正在阅读第 2 条', w: 6 },
      { t: '正在阅读第 3 条', w: 5 },
      { t: '正在核对来源', w: 4 }

    if (realSearch) steps.splice(1, 0, { t: '等待百度响应', w: 4 });
    for (var ei = 1; ei < engRun.length; ei++) {
      steps.push({ t: '换 ' + engRun[ei].name + ' 再搜一遍', w: web ? 9 : 7 });
    }

      steps.forEach(function (s) { s.w *= 1.9; });

        steps.push({ t: '开始深度发呆', w: 9, cot: 0 });

      }

    if (follow) steps = [{ t: '正在回忆你刚才问了什么', w: 5 }, { t: '决定不重新搜', w: 3 }];

    var fixed = qs.think ? parseInt(qs.think, 10) : 0;
    var i = 0;

    function paint() {
      var secs = ((Date.now() - t0) / 1000).toFixed(1);
      if (typingNode) typingNode.textContent = (m.stage || '正在处理') + '… ' + secs + 's';
      if (barNode) barNode.style.width = Math.min(m.prog, 100) + '%';

    curCancel = function () { finish(true); };
    syncSend();
    paint();

      var st = steps[i++];
      m.stage = st.t;
      m.prog = Math.round((i / steps.length) * 92);

        if (cotNode) {

  function send() {
    var text = value();

    var c = ensureConv();
    c.attempt = 0;
    var sentFile = pendingFile;
    pendingFile = null;
    renderAttachChip();

    /* 编辑态：改的是已有问题 */
    if (editingMe >= 0 && c.msgs[editingMe]) {
      var em = c.msgs[editingMe];
      if (text !== em.t) {
        if (!em.versions) em.versions = [];
        em.versions.push({ t: em.t, at: Date.now(), answers: (em.answers || []).slice() });
        em.t = text;
        em.answers = [];
        em.vsel = em.versions.length;

      save();
      syncSend();
      scheduleSeen(c);
      stickBottom = true;
      startSearch(text, null, editingMeAfter(c, em));
      return;
    }

    var mi = c.msgs.length;
    var mid = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    c.msgs.push({ id: mid, r: 'me', t: text, seen: 0, file: sentFile || null, i: mi, answers: [], sel: -1 });
