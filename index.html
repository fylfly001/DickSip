    peekDashItems.forEach(function (it, i) {
      var d = document.createElement('i');
      d.className = 'dks-peek-dash';
      d.setAttribute('data-idx', it.idx);
      d.title = it.text.slice(0, 40);
      d.addEventListener('click', function (e) {
        e.stopPropagation();
        jumpToMsg(it.idx);
      });
      peekZone.appendChild(d);
    });
    syncPeekActive();
  }

  /* 找到当前滚动位置所在的条目，高亮它的刻度 */
  function syncPeekActive() {
    if (!msgsEl || !peekDashItems || !peekDashItems.length) return;
    var boxRect = msgsEl.getBoundingClientRect();
    var line = boxRect.top + 120;
    var atBottom = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 8;
    var curIdx;

    if (atBottom) {
      curIdx = peekDashItems[peekDashItems.length - 1].idx;
    } else {
      /* 取视口顶部以下、最靠近顶部的那一条 */
      curIdx = peekDashItems[0].idx;
      for (var i = 0; i < peekDashItems.length; i++) {
        var el = msgsEl.querySelector('[data-i="' + peekDashItems[i].idx + '"]');
        if (!el) continue;
        if (el.getBoundingClientRect().top <= line) curIdx = peekDashItems[i].idx;
        else break;
      }
    }

    var dashes = peekZone.querySelectorAll('.dks-peek-dash');
    for (var k = 0; k < dashes.length; k++) {
      dashes[k].classList.toggle('is-current', dashes[k].getAttribute('data-idx') === String(curIdx));
    }
  }
  renderPeekDashes();
  setInterval(function () {
    syncPeekActive();
  }, 400);

  peekZone.addEventListener('mouseenter', showPeek);
  peekZone.addEventListener('mouseleave', hidePeek);

  peekPanel.addEventListener('mouseenter', keepPeek);
  peekPanel.addEventListener('mouseleave', hidePeek);

  document.getElementById('root').appendChild(peekZone);
  document.getElementById('root').appendChild(peekPanel);
  var dock = document.createElement('div');
  dock.className = 'dks-mini-dock';

  var logoBtn = document.createElement('button');
  logoBtn.type = 'button';
  logoBtn.className = 'dks-dock-brand';
  logoBtn.title = 'DickSip';
  logoBtn.setAttribute('aria-label', 'DickSip');
  var dockName = document.createElement('span');
  dockName.textContent = 'DickSip';
  logoBtn.appendChild(dockName);
  logoBtn.appendChild(brandMark());
  logoBtn.addEventListener('click', function () { setSide(true); });

  var mini = document.createElement('div');
  mini.className = 'dks-mini';
  mini.appendChild(miniBtn('sidebar', '展开边栏', function () { setSide(true); }));
  mini.appendChild(miniBtn('search', '搜索对话', function () {
    setSide(true);
    var se = panel && panel.querySelector('.dks-search');
    if (se) { se.focus(); se.select(); }
  }));
  mini.appendChild(miniBtn('plus', '新建对话', function () { newChat(); }));

  dock.appendChild(logoBtn);
  dock.appendChild(mini);
  document.getElementById('root').appendChild(dock);

  /* ================= 侧栏初始状态（记住上次；宽屏默认展开） ================= */
  (function sideInit() {
    var saved = store.get(SIDE_KEY);
    var open = saved === '1' || (saved !== '0' && window.innerWidth >= 1100);
    setSide(open);
  })();
  window.addEventListener('resize', function () {
    backdrop.classList.toggle('is-open', sideIsOpen() && sideNarrow());
  });


  /* ================= 演示链接（?demo=问题） ================= */
  function demoBase() { return location.href.split('?')[0].split('#')[0]; }
  function demoExit() {
    try { location.replace(demoBase()); } catch (e) { location.reload(); }
  }
  function demoStrip() {
    try { history.replaceState(null, '', demoBase()); } catch (e) {}
  }
  function demoBanner() {
    if (document.getElementById('dksDemoBar')) return;
    var bar = document.createElement('div');
    bar.id = 'dksDemoBar';
    bar.className = 'dks-demo-bar';
    var dot = document.createElement('i');
    dot.className = 'dks-demo-dot';
    dot.setAttribute('aria-hidden', 'true');
    var txt = document.createElement('span');
    txt.textContent = '演示模式 · 不写本机记录，也不动你的对话';
    var out = document.createElement('button');
    out.type = 'button';
    out.className = 'dks-demo-out';
    out.textContent = '退出演示';
    out.addEventListener('click', demoExit);
    bar.appendChild(dot);
    bar.appendChild(txt);
    bar.appendChild(out);
    document.getElementById('root').appendChild(bar);
  }
  /* 谁都能生成这条链接，所以发送前必须由本人点头 */
  function askDemo(text) {
    if (!ta) return;
    var wrap = document.createElement('div');
    wrap.id = 'dksDemoAsk';
    wrap.className = 'dks-modal dks-confirm dks-demoask';
    wrap.innerHTML =
      '<div class="dks-confirm-card" role="dialog" aria-modal="true" aria-label="这是一条演示链接">' +
        '<h3>这是一条演示链接</h3>' +
        '<p>它会替你在对话框里发一句话，看着就像你自己问过的。</p>' +
        '<div class="dks-demo-q"></div>' +
        '<p class="dks-demo-note">确认之前什么都不发。演示只在本页内存里跑：不写入本机对话记录，不改动你的设置，刷新就没了。</p>' +
        '<div class="dks-confirm-acts">' +
          '<button type="button" class="dks-confirm-cancel">算了</button>' +
          '<button type="button" class="dks-confirm-go">开始演示</button>' +
        '</div>' +
      '</div>';
    wrap.querySelector('.dks-demo-q').textContent = text;
    wrap.addEventListener('click', function (e) { if (e.target === wrap) cancel(); });
    wrap.querySelector('.dks-confirm-cancel').addEventListener('click', cancel);
    wrap.querySelector('.dks-confirm-go').addEventListener('click', go);
    var onKey = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    };
    document.addEventListener('keydown', onKey);

    function done() {
      document.removeEventListener('keydown', onKey);
      wrap.classList.remove('is-open');
      setTimeout(function () { wrap.remove(); }, 200);
    }
    function cancel() {
      done();
      demoStrip();
      toast('没有演示，也没有发消息。');
    }
    function go() {
      done();
      if (busy) return;
      demoBanner();
      var c0 = cur();
      if (!c0 || c0.msgs.length) newConv();
      ta.value = text;
      autosize();
      send();
      toast('演示对话不会保存，关掉页面就散场。');
    }
    document.getElementById('root').appendChild(wrap);
    revealOpen(wrap);
    try { wrap.querySelector('.dks-confirm-go').focus(); } catch (e) {}
  }

  /* ================= 启动 ================= */
  if (!cur()) {
    var first = sortedConvs()[0];
    if (first) db.active = first.id;
    else newConv();
  }
  render();

  if (qs.panel) openPanel();
  if (DEMO) askDemo(DEMO_TEXT);
  syncSend();
})();</script>
</body></html>
